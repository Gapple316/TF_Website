<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gabriel als Zeichenfigur. Begleitet den Besucher durch Programm und
  Vorstellung und steht bei der Begruessung gross im Bild.

  Naeher am Kontaktfoto als die erste Fassung: kurzes, nach vorn gestruppeltes
  braunes Haar mit hoher Stirn, schmales Gesicht, dunkle Jacke mit Stehkragen
  und hellem Kragenfutter. Es bleibt eine Zeichnung, kein Portrait - aber man
  erkennt denselben Menschen wieder.

  Zum Austauschen genuegt es, diese Datei zu ersetzen. Seitenverhaeltnis
  96 zu 120, Figur steht auf der Grundlinie.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120" width="96" height="120" role="img">
  <title>Gabriel als Zeichenfigur</title>

  <defs>
    <filter id="boil-figur" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2" result="rauschen">
        <animate attributeName="seed" values="2;6;3;9;5;2" dur="0.72s"
                 calcMode="discrete" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="rauschen" scale="1.3"
                         xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <style>
    /* Der Line Boil laeuft ueber einen Filter, der sich hier abschalten
       laesst - entscheidend, weil diese Datei als Bild eingebunden ist und
       JavaScript von aussen nicht hineinreicht. Die Medienabfrage wertet der
       Browser trotzdem aus. */
    .boil { filter: url(#boil-figur); }
    @media (prefers-reduced-motion: reduce) {
      .boil { filter: none; }
    }
  </style>

  <g class="boil">
    <!-- Schultern und Jacke, dunkel wie auf dem Foto -->
    <path d="M14 120 L14 92 C14 82 24 76 36 74 L60 74 C72 76 82 82 82 92 L82 120 Z"
          fill="#15110e" />
    <!-- Reissverschlussleiste -->
    <path d="M48 76 L48 120" stroke="#241c17" stroke-width="2" />
    <!-- Heller Kragen, innen -->
    <path d="M38 74 L48 86 L58 74 L54 72 L48 78 L42 72 Z" fill="#cfc6b4" />
    <!-- Stehkragen -->
    <path d="M36 74 C40 80 44 83 48 84 C52 83 56 80 60 74
             C58 71 54 69 48 69 C42 69 38 71 36 74 Z" fill="#1d1813" />

    <!-- Hals -->
    <path d="M42 60 L54 60 L54 72 L42 72 Z" fill="#e4d6c2" />

    <!-- Kopf: eher rund als schmal, wie auf dem Foto -->
    <ellipse cx="48" cy="44.5" rx="17" ry="18.5" fill="#efe2cf" />

    <!-- Haar: kurz, hohe Stirn, nach vorn gestruppelt -->
    <path d="M31 45 C29 30 37 21 48 21 C59 21 67 30 65 45
             C63 38 61 34 58 33
             C55 36 50 34 47 31
             C44 35 40 36 37 34
             C34 36 32 40 31 45 Z"
          fill="#3f2d20" />
    <!-- einzelne Straehnen -->
    <path d="M37 28 C41 24 47 23 51 24" stroke="#2f2017" stroke-width="1.8"
          stroke-linecap="round" fill="none" />
    <path d="M52 25 C57 27 60 31 62 35" stroke="#2f2017" stroke-width="1.6"
          stroke-linecap="round" fill="none" />

    <!-- Ohren -->
    <ellipse cx="31.5" cy="46" rx="2.6" ry="3.6" fill="#e4d6c2" />
    <ellipse cx="64.5" cy="46" rx="2.6" ry="3.6" fill="#e4d6c2" />

    <!-- Augenbrauen, Augen, Nase, Mund -->
    <path d="M38 40 C40 38.4 44 38.4 46 40" stroke="#3a281c" stroke-width="1.6"
          stroke-linecap="round" fill="none" />
    <path d="M50 40 C52 38.4 56 38.4 58 40" stroke="#3a281c" stroke-width="1.6"
          stroke-linecap="round" fill="none" />
    <circle cx="42" cy="45" r="2.1" fill="#2b2119" />
    <circle cx="54" cy="45" r="2.1" fill="#2b2119" />
    <path d="M48 47 L48 52 L50.5 53" stroke="#c8b49a" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Breites Lächeln, das offene auf dem Foto -->
    <path d="M40.5 55 C44 60.5 52 60.5 55.5 55" stroke="#8a6a53" stroke-width="2"
          stroke-linecap="round" fill="none" />

    <!-- Lichtkante von der Leinwand -->
    <path d="M63 36 C66 42 66 50 63 55" stroke="#c9a227" stroke-width="2"
          stroke-linecap="round" fill="none" opacity="0.5" />
  </g>
</svg>
