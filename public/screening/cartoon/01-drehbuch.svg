<?xml version="1.0" encoding="UTF-8"?>
<!--
  Szene 1: Drehbuch. Schreibtisch, Notizen, Kaffee, später Abend.
  Dauerschleife: der Cursor auf dem Bildschirm blinkt.

  PLATZHALTER im richtigen Stil und Format (400x300). Austauschbar, ohne dass
  am Code etwas zu ändern wäre.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>Gabriel am Schreibtisch beim Schreiben, später Abend</title>

  <defs>
    <filter id="boil-01" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="r">
        <animate attributeName="seed" values="3;8;1;6;4;3" dur="0.72s"
                 calcMode="discrete" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="1.7"
                         xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <style>
    /* Der Line Boil und die Dauerschleifen laufen ueber CSS bzw. einen
       Filter. Beides laesst sich hier abschalten - entscheidend, weil diese
       Datei als Bild eingebunden ist und JavaScript von aussen nicht
       hineinreicht. Die Medienabfrage wertet der Browser trotzdem aus. */
    .boil { filter: url(#boil-01); }
    .blink { animation: tf-blink 1.1s steps(1, end) infinite; }
    .tally { animation: tf-tally 1.6s steps(1, end) infinite; }
    .flicker { animation: tf-flicker 6s ease-in-out infinite; }
    .steam { animation: tf-steam 3.4s ease-in-out infinite; }
    .playhead { animation: tf-playhead 7s linear infinite; }

    @keyframes tf-blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
    @keyframes tf-tally { 0%, 70% { opacity: 1 } 70.01%, 85% { opacity: 0.15 } 85.01%, 100% { opacity: 1 } }
    @keyframes tf-flicker { 0%, 100% { opacity: 0.1 } 40% { opacity: 0.2 } 46% { opacity: 0.08 } }
    @keyframes tf-steam { 0%, 100% { opacity: 0.7 } 50% { opacity: 0.2 } }
    @keyframes tf-playhead { 0% { transform: translateX(0) } 50% { transform: translateX(142px) } 100% { transform: translateX(0) } }

    @media (prefers-reduced-motion: reduce) {
      .boil { filter: none; }
      .blink, .tally, .flicker, .steam, .playhead { animation: none; }
    }
  </style>

  <rect width="400" height="300" fill="#0b0a09" />
  <!-- Fenster, Nacht -->
  <rect x="24" y="26" width="92" height="104" fill="#141b24" />
  <path d="M70 26 L70 130 M24 78 L116 78" stroke="#0b0a09" stroke-width="4" />
  <circle cx="98" cy="48" r="7" fill="#c9a227" opacity="0.5" />

  <g class="boil">
    <!-- Tisch -->
    <path d="M18 232 L382 232 L382 246 L18 246 Z" fill="#2a211a" />
    <path d="M44 246 L44 290 M356 246 L356 290" stroke="#2a211a" stroke-width="10" />

    <!-- Monitor -->
    <rect x="212" y="138" width="132" height="84" rx="4" fill="#15110e" stroke="#efe7d6" stroke-width="3" />
    <rect x="222" y="148" width="112" height="64" fill="#0f1a16" />
    <path d="M232 164 L300 164 M232 176 L288 176 M232 188 L306 188"
          stroke="#6f8a7d" stroke-width="3" stroke-linecap="round" />
    <!-- blinkender Cursor -->
    <rect class="blink" x="312" y="184" width="4" height="12" fill="#efe7d6" />
    <path d="M262 222 L294 222 L298 232 L258 232 Z" fill="#15110e" />

    <!-- Schreibtischlampe -->
    <path d="M120 232 L120 176 L156 150" stroke="#efe7d6" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M150 138 L182 152 L162 168 Z" fill="#c9a227" />
    <path d="M166 160 L206 232 L126 232 Z" fill="#c9a227" opacity="0.14" />

    <!-- Figur: am Tisch, über Notizen gebeugt -->
    <path d="M96 232 L96 196 C96 186 104 180 118 180 C132 180 140 186 140 196 L140 232 Z"
          fill="#15110e" />
    <ellipse cx="118" cy="164" rx="17" ry="19" fill="#efe7d6" />
    <path d="M101 160 C102 148 109 143 118 143 C127 143 134 148 135 160 C132 154 127 151 118 152 C110 153 105 155 101 160 Z"
          fill="#1b1813" />
    <circle cx="124" cy="166" r="1.9" fill="#1b1813" />
    <path d="M126 174 C129 176 132 176 134 174" stroke="#1b1813" stroke-width="1.8"
          stroke-linecap="round" fill="none" />
    <!-- Arm zum Stift -->
    <path d="M138 198 C156 200 166 210 172 220" stroke="#15110e" stroke-width="8"
          stroke-linecap="round" fill="none" />

    <!-- Notizblock und Stift -->
    <path d="M162 226 L214 222 L216 234 L164 238 Z" fill="#efe7d6" />
    <path d="M172 228 L204 226 M172 233 L198 231" stroke="#8d8373" stroke-width="2" stroke-linecap="round" />
    <path d="M176 218 L190 206" stroke="#c8392f" stroke-width="4" stroke-linecap="round" />

    <!-- Kaffee -->
    <path d="M330 206 L356 206 L352 232 L334 232 Z" fill="#efe7d6" />
    <path d="M356 212 C366 212 366 224 356 224" stroke="#efe7d6" stroke-width="3" fill="none" />
    <path class="steam" d="M338 198 C340 192 344 194 346 188" stroke="#8d8373" stroke-width="2"
          stroke-linecap="round" fill="none" opacity="0.7" />
  </g>
</svg>
