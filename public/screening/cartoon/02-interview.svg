<?xml version="1.0" encoding="UTF-8"?>
<!--
  Szene 2: Nachrichten. Kamera auf der Schulter, Mikrofon, Interviewsituation.
  Dauerschleife: das rote Tally-Licht an der Kamera blinkt.

  Bewusst keine echten Senderlogos – das Mikrofonfähnchen bleibt leer.
  PLATZHALTER im richtigen Stil und Format (400x300).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>Gabriel filmt ein Interview, Kamera auf der Schulter</title>

  <defs>
    <filter id="boil-02" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="r">
        <animate attributeName="seed" values="5;1;7;3;9;5" dur="0.72s"
                 calcMode="discrete" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="1.7"
                         xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <style>
    /* Der Line Boil und die Dauerschleifen laufen ueber CSS bzw. einen
       Filter. Beides laesst sich hier abschalten - entscheidend, weil diese
       Datei als Bild eingebunden ist und JavaScript von aussen nicht
       hineinreicht. Die Medienabfrage wertet der Browser trotzdem aus. */
    .boil { filter: url(#boil-02); }
    .blink { animation: tf-blink 1.1s steps(1, end) infinite; }
    .tally { animation: tf-tally 1.6s steps(1, end) infinite; }
    .flicker { animation: tf-flicker 6s ease-in-out infinite; }
    .steam { animation: tf-steam 3.4s ease-in-out infinite; }
    .playhead { animation: tf-playhead 7s linear infinite; }

    @keyframes tf-blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
    @keyframes tf-tally { 0%, 70% { opacity: 1 } 70.01%, 85% { opacity: 0.15 } 85.01%, 100% { opacity: 1 } }
    @keyframes tf-flicker { 0%, 100% { opacity: 0.1 } 40% { opacity: 0.2 } 46% { opacity: 0.08 } }
    @keyframes tf-steam { 0%, 100% { opacity: 0.7 } 50% { opacity: 0.2 } }
    @keyframes tf-playhead { 0% { transform: translateX(0) } 50% { transform: translateX(142px) } 100% { transform: translateX(0) } }

    @media (prefers-reduced-motion: reduce) {
      .boil { filter: none; }
      .blink, .tally, .flicker, .steam, .playhead { animation: none; }
    }
  </style>

  <rect width="400" height="300" fill="#0b0a09" />
  <!-- Draußen, angedeutete Häuserkante -->
  <path d="M0 196 L54 196 L54 142 L104 142 L104 196 L170 196 L170 166 L212 166 L212 196 L400 196 L400 300 L0 300 Z"
        fill="#161310" />

  <g class="boil">
    <!-- Interviewpartner rechts -->
    <path d="M284 300 L284 232 C284 218 296 210 314 210 C332 210 344 218 344 232 L344 300 Z"
          fill="#2a211a" />
    <ellipse cx="314" cy="186" rx="19" ry="21" fill="#efe7d6" />
    <path d="M295 182 C296 168 304 162 314 162 C324 162 332 168 333 182 C329 174 323 171 314 172 C305 173 299 176 295 182 Z"
          fill="#4a3a2c" />
    <circle cx="307" cy="188" r="2" fill="#1b1813" />
    <circle cx="321" cy="188" r="2" fill="#1b1813" />
    <path d="M308 198 C312 201 317 201 320 198" stroke="#1b1813" stroke-width="2"
          stroke-linecap="round" fill="none" />

    <!-- Mikrofon mit leerem Fähnchen -->
    <path d="M250 214 L268 206" stroke="#15110e" stroke-width="7" stroke-linecap="round" />
    <rect x="256" y="190" width="26" height="22" rx="2" fill="#efe7d6" />
    <circle cx="272" cy="204" r="7" fill="#15110e" />

    <!-- Figur links mit Kamera auf der Schulter -->
    <path d="M56 300 L56 234 C56 220 68 212 86 212 C104 212 116 220 116 234 L116 300 Z"
          fill="#15110e" />
    <ellipse cx="86" cy="188" rx="18" ry="20" fill="#efe7d6" />
    <path d="M68 184 C69 171 76 166 86 166 C96 166 103 171 104 184 C100 177 95 174 86 175 C78 176 72 179 68 184 Z"
          fill="#1b1813" />
    <circle cx="93" cy="190" r="1.9" fill="#1b1813" />
    <path d="M95 198 C98 200 101 200 103 198" stroke="#1b1813" stroke-width="1.8"
          stroke-linecap="round" fill="none" />

    <!-- Kamera -->
    <rect x="96" y="158" width="86" height="44" rx="4" fill="#211a15" stroke="#efe7d6" stroke-width="2.5" />
    <rect x="182" y="168" width="22" height="24" rx="2" fill="#211a15" stroke="#efe7d6" stroke-width="2.5" />
    <rect x="112" y="140" width="38" height="20" rx="3" fill="#2a211a" stroke="#efe7d6" stroke-width="2" />
    <!-- Sucher -->
    <path d="M96 170 L76 178 L76 192 L96 190 Z" fill="#2a211a" stroke="#efe7d6" stroke-width="2" />
    <!-- Tally-Licht -->
    <circle class="tally" cx="190" cy="162" r="5" fill="#c8392f" />
    <!-- Hand am Griff -->
    <path d="M118 212 C132 206 142 200 150 196" stroke="#15110e" stroke-width="8"
          stroke-linecap="round" fill="none" />
  </g>
</svg>
