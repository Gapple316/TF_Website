<?xml version="1.0" encoding="UTF-8"?>
<!--
  Szene 3: Werbung. Studiolicht, Softboxen, Slider, sauberes Set.
  Dauerschleife: die linke Softbox flackert kurz an.

  PLATZHALTER im richtigen Stil und Format (400x300).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>Gabriel an einem ausgeleuchteten Set mit Softboxen und Slider</title>

  <defs>
    <filter id="boil-03" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="r">
        <animate attributeName="seed" values="7;2;9;4;6;7" dur="0.72s"
                 calcMode="discrete" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="1.7"
                         xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <style>
    /* Der Line Boil und die Dauerschleifen laufen ueber CSS bzw. einen
       Filter. Beides laesst sich hier abschalten - entscheidend, weil diese
       Datei als Bild eingebunden ist und JavaScript von aussen nicht
       hineinreicht. Die Medienabfrage wertet der Browser trotzdem aus. */
    .boil { filter: url(#boil-03); }
    .blink { animation: tf-blink 1.1s steps(1, end) infinite; }
    .tally { animation: tf-tally 1.6s steps(1, end) infinite; }
    .flicker { animation: tf-flicker 6s ease-in-out infinite; }
    .steam { animation: tf-steam 3.4s ease-in-out infinite; }
    .playhead { animation: tf-playhead 7s linear infinite; }

    @keyframes tf-blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
    @keyframes tf-tally { 0%, 70% { opacity: 1 } 70.01%, 85% { opacity: 0.15 } 85.01%, 100% { opacity: 1 } }
    @keyframes tf-flicker { 0%, 100% { opacity: 0.1 } 40% { opacity: 0.2 } 46% { opacity: 0.08 } }
    @keyframes tf-steam { 0%, 100% { opacity: 0.7 } 50% { opacity: 0.2 } }
    @keyframes tf-playhead { 0% { transform: translateX(0) } 50% { transform: translateX(142px) } 100% { transform: translateX(0) } }

    @media (prefers-reduced-motion: reduce) {
      .boil { filter: none; }
      .blink, .tally, .flicker, .steam, .playhead { animation: none; }
    }
  </style>

  <rect width="400" height="300" fill="#0b0a09" />
  <!-- Hohlkehle -->
  <path d="M0 300 L0 120 C120 96 280 96 400 120 L400 300 Z" fill="#191512" />

  <g class="boil">
    <!-- Softbox links mit Flackern -->
    <g>
      <path d="M26 92 L92 74 L92 142 L26 160 Z" fill="#efe7d6" opacity="0.92" />
      <path class="flicker" d="M92 108 L210 140 L210 184 L92 142 Z" fill="#efe7d6" opacity="0.1" />
      <path d="M56 160 L56 236" stroke="#2a211a" stroke-width="5" />
      <path d="M34 236 L78 236" stroke="#2a211a" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Softbox rechts, kleiner -->
    <path d="M344 112 L300 100 L300 150 L344 162 Z" fill="#efe7d6" opacity="0.7" />
    <path d="M322 162 L322 230" stroke="#2a211a" stroke-width="4" />

    <!-- Produkt auf dem Podest -->
    <path d="M196 206 L244 206 L240 232 L200 232 Z" fill="#5c1512" />
    <ellipse cx="220" cy="206" rx="24" ry="6" fill="#7d1f1a" />
    <path d="M176 232 L264 232 L264 244 L176 244 Z" fill="#241c17" />

    <!-- Slider mit Kamera -->
    <path d="M118 268 L300 268" stroke="#2a211a" stroke-width="8" stroke-linecap="round" />
    <rect x="186" y="240" width="56" height="26" rx="3" fill="#211a15" stroke="#efe7d6" stroke-width="2.5" />
    <circle cx="214" cy="253" r="8" fill="#0b0a09" stroke="#efe7d6" stroke-width="2" />

    <!-- Figur rechts, kontrolliert das Bild -->
    <path d="M300 300 L300 240 C300 228 310 221 324 221 C338 221 348 228 348 240 L348 300 Z"
          fill="#15110e" />
    <ellipse cx="324" cy="200" rx="17" ry="19" fill="#efe7d6" />
    <path d="M307 196 C308 184 315 179 324 179 C333 179 340 184 341 196 C337 190 332 187 324 188 C316 189 311 191 307 196 Z"
          fill="#1b1813" />
    <circle cx="318" cy="202" r="1.9" fill="#1b1813" />
    <circle cx="330" cy="202" r="1.9" fill="#1b1813" />
    <path d="M319 210 C322 213 327 213 330 210" stroke="#1b1813" stroke-width="1.8"
          stroke-linecap="round" fill="none" />
    <!-- Arm zum Monitor -->
    <path d="M300 244 C284 244 274 250 268 256" stroke="#15110e" stroke-width="8"
          stroke-linecap="round" fill="none" />
  </g>
</svg>
