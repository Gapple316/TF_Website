<?xml version="1.0" encoding="UTF-8"?>
<!--
  Szene 4: Schnitt. Zwei Monitore, Timeline, Kopfhörer.
  Dauerschleife: der Playhead läuft durch die Timeline.

  PLATZHALTER im richtigen Stil und Format (400x300).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>Gabriel am Schnittplatz mit zwei Monitoren und Kopfhörern</title>

  <defs>
    <filter id="boil-04" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="r">
        <animate attributeName="seed" values="9;4;1;8;3;9" dur="0.72s"
                 calcMode="discrete" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="r" scale="1.7"
                         xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <style>
    /* Der Line Boil und die Dauerschleifen laufen ueber CSS bzw. einen
       Filter. Beides laesst sich hier abschalten - entscheidend, weil diese
       Datei als Bild eingebunden ist und JavaScript von aussen nicht
       hineinreicht. Die Medienabfrage wertet der Browser trotzdem aus. */
    .boil { filter: url(#boil-04); }
    .blink { animation: tf-blink 1.1s steps(1, end) infinite; }
    .tally { animation: tf-tally 1.6s steps(1, end) infinite; }
    .flicker { animation: tf-flicker 6s ease-in-out infinite; }
    .steam { animation: tf-steam 3.4s ease-in-out infinite; }
    .playhead { animation: tf-playhead 7s linear infinite; }

    @keyframes tf-blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
    @keyframes tf-tally { 0%, 70% { opacity: 1 } 70.01%, 85% { opacity: 0.15 } 85.01%, 100% { opacity: 1 } }
    @keyframes tf-flicker { 0%, 100% { opacity: 0.1 } 40% { opacity: 0.2 } 46% { opacity: 0.08 } }
    @keyframes tf-steam { 0%, 100% { opacity: 0.7 } 50% { opacity: 0.2 } }
    @keyframes tf-playhead { 0% { transform: translateX(0) } 50% { transform: translateX(142px) } 100% { transform: translateX(0) } }

    @media (prefers-reduced-motion: reduce) {
      .boil { filter: none; }
      .blink, .tally, .flicker, .steam, .playhead { animation: none; }
    }
  </style>

  <rect width="400" height="300" fill="#0b0a09" />
  <rect x="0" y="236" width="400" height="64" fill="#1d1712" />

  <g class="boil">
    <!-- Linker Monitor: Bild -->
    <rect x="26" y="66" width="156" height="98" rx="4" fill="#15110e" stroke="#efe7d6" stroke-width="3" />
    <rect x="34" y="74" width="140" height="82" fill="#232d2a" />
    <path d="M34 134 L72 104 L100 126 L132 92 L174 134 Z" fill="#3c4a44" />
    <circle cx="146" cy="92" r="9" fill="#c9a227" opacity="0.7" />
    <path d="M86 164 L122 164 L126 176 L82 176 Z" fill="#15110e" />

    <!-- Rechter Monitor: Timeline -->
    <rect x="200" y="86" width="174" height="92" rx="4" fill="#15110e" stroke="#efe7d6" stroke-width="3" />
    <rect x="208" y="94" width="158" height="76" fill="#12100e" />
    <rect x="214" y="104" width="86" height="12" rx="2" fill="#5c1512" />
    <rect x="304" y="104" width="54" height="12" rx="2" fill="#7d1f1a" />
    <rect x="214" y="122" width="62" height="10" rx="2" fill="#3c4a44" />
    <rect x="280" y="122" width="78" height="10" rx="2" fill="#2f3a35" />
    <rect x="214" y="138" width="144" height="8" rx="2" fill="#c9a227" opacity="0.45" />
    <!-- Playhead -->
    <g>
      <rect class="playhead" x="214" y="98" width="2.5" height="66" fill="#efe7d6" />
    </g>
    <path d="M262 178 L312 178 L316 190 L258 190 Z" fill="#15110e" />

    <!-- Tisch -->
    <path d="M10 232 L390 232 L390 244 L10 244 Z" fill="#2a211a" />

    <!-- Figur von hinten, Kopfhörer auf -->
    <path d="M140 300 L140 240 C140 226 152 218 172 218 C192 218 204 226 204 240 L204 300 Z"
          fill="#15110e" />
    <ellipse cx="172" cy="196" rx="19" ry="21" fill="#1b1813" />
    <!-- Kopfhörerbügel und Muscheln -->
    <path d="M151 192 C153 176 163 169 172 169 C181 169 191 176 193 192"
          stroke="#efe7d6" stroke-width="4" fill="none" stroke-linecap="round" />
    <rect x="144" y="188" width="12" height="20" rx="5" fill="#efe7d6" />
    <rect x="188" y="188" width="12" height="20" rx="5" fill="#efe7d6" />
    <!-- Arm zur Maus -->
    <path d="M204 244 C220 244 230 248 238 252" stroke="#15110e" stroke-width="8"
          stroke-linecap="round" fill="none" />
    <ellipse cx="246" cy="254" rx="10" ry="7" fill="#efe7d6" />
  </g>
</svg>
